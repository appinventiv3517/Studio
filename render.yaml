# Backend on Render (Blueprint). The same build serves the API; the website on Vercel forwards /api here.
services:
  - type: web
    name: salon-studio-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/public/branding
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL # MongoDB Atlas connection string, with a database name (…mongodb.net/salon?…)
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_URL # the Vercel address, e.g. https://salon-studio.vercel.app
        sync: false
